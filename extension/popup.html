<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Buzzword Decoder</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #16181d;
        --muted: #6b7280;
        --border: #e2e5ea;
        --accent: #b4530a;
        --accent-fg: #ffffff;
        --field: #f7f8fa;
        --ok-bg: #edf7ee;
        --ok-fg: #1d6b2b;
        --err-bg: #fdeeee;
        --err-fg: #a3241f;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17191d;
          --fg: #eceef1;
          --muted: #9aa1ad;
          --border: #2c2f36;
          --accent: #e2803a;
          --accent-fg: #17191d;
          --field: #202329;
          --ok-bg: #16261a;
          --ok-fg: #7bc98a;
          --err-bg: #2a1919;
          --err-fg: #ef8d86;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      h1 {
        margin: 0 0 2px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .sub {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 12px;
      }

      button#decode {
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-fg);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      button#decode:hover:not(:disabled) {
        filter: brightness(1.06);
      }

      button#decode:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .status {
        display: none;
        margin-top: 12px;
        padding: 9px 11px;
        border-radius: 7px;
        font-size: 12.5px;
      }

      .status.visible {
        display: block;
      }

      .status.loading {
        background: var(--field);
        color: var(--muted);
      }

      .status.done {
        background: var(--ok-bg);
        color: var(--ok-fg);
      }

      .status.error {
        background: var(--err-bg);
        color: var(--err-fg);
      }

      .spinner {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 7px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        vertical-align: -1px;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .settings {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
      }

      label {
        display: block;
        margin-bottom: 5px;
        color: var(--muted);
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .row {
        display: flex;
        gap: 6px;
      }

      input[type="url"] {
        flex: 1;
        min-width: 0;
        padding: 7px 9px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--field);
        color: var(--fg);
        font-size: 12.5px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }

      input[type="url"]:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }

      button#save {
        padding: 7px 11px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--field);
        color: var(--fg);
        font-size: 12.5px;
        cursor: pointer;
      }

      button#save:hover {
        border-color: var(--accent);
      }

      .hint {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 11.5px;
      }
    </style>
  </head>
  <body>
    <h1>Buzzword Decoder</h1>
    <p class="sub">Find the jargon on this page and say what it actually means.</p>

    <button id="decode" type="button">Decode This Page</button>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <div class="settings">
      <label for="proxy-url">Proxy server</label>
      <div class="row">
        <input
          id="proxy-url"
          type="url"
          spellcheck="false"
          placeholder="http://localhost:3000"
        />
        <button id="save" type="button">Save</button>
      </div>
      <p class="hint">Your API key lives on this server, never in the browser.</p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
