<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Buzzword Decoder</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #16181d;
        --muted: #9aa0a8;
        --border: #eceeef;
        --track: #e9ebed;
        --button-idle: #16181d;
        --button-idle-fg: #ffffff;
        --button-loading: #55585e;
        --quote: #b4530a;
        --link: #2f5fd1;
        --ok: #1d6b2b;
        --err: #a3241f;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17191d;
          --fg: #eceef1;
          --muted: #868c96;
          --border: #2a2d33;
          --track: #2a2d33;
          --button-idle: #eceef1;
          --button-idle-fg: #16181d;
          --button-loading: #4b4e55;
          --quote: #e2924e;
          --link: #7ea1ff;
          --ok: #7bc98a;
          --err: #ef8d86;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 360px;
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      .mono {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }

      header {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 14px;
      }

      .app-icon {
        width: 18px;
        height: 18px;
        flex: none;
        border-radius: 5px;
        background: var(--fg);
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .proxy-row {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 14px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 12.5px;
      }

      .proxy-icon {
        flex: none;
        width: 13px;
        height: 13px;
      }

      #proxy-display {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .link-btn {
        flex: none;
        padding: 0;
        border: 0;
        background: none;
        color: var(--muted);
        font-size: 12.5px;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }

      .link-btn:hover {
        color: var(--fg);
      }

      .proxy-edit {
        display: flex;
        gap: 6px;
        margin-bottom: 14px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
      }

      .proxy-edit[hidden],
      .proxy-row[hidden] {
        display: none;
      }

      input[type="url"] {
        flex: 1;
        min-width: 0;
        padding: 7px 9px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        font-size: 12.5px;
      }

      input[type="url"]:focus {
        outline: 2px solid var(--link);
        outline-offset: -1px;
      }

      button#save {
        flex: none;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
      }

      button#save:hover {
        border-color: var(--fg);
      }

      button#decode {
        width: 100%;
        padding: 11px 12px;
        border: 0;
        border-radius: 8px;
        background: var(--button-idle);
        color: var(--button-idle-fg);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 150ms ease;
      }

      button#decode:disabled {
        background: var(--button-loading);
        color: #ffffff;
        cursor: default;
      }

      .progress-track {
        margin-top: 10px;
        height: 4px;
        border-radius: 2px;
        background: var(--track);
        overflow: hidden;
      }

      .progress-track[hidden] {
        display: none;
      }

      .progress-fill {
        width: 0%;
        height: 100%;
        border-radius: 2px;
        background: var(--button-idle);
        transition: width 220ms ease;
      }

      .status {
        margin: 10px 0 0;
        min-height: 16px;
        color: var(--muted);
        font-size: 12.5px;
        text-align: center;
      }

      .status.ok {
        color: var(--ok);
      }

      .status.error {
        color: var(--err);
      }
    </style>
  </head>
  <body>
    <header>
      <span class="app-icon" aria-hidden="true"></span>
      <h1>Buzzword Decoder</h1>
    </header>

    <div id="proxy-row" class="proxy-row">
      <svg class="proxy-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="6.25" stroke="currentColor" stroke-width="1.3" />
        <circle cx="8" cy="8" r="2" fill="currentColor" />
      </svg>
      <span id="proxy-display" class="mono">localhost:3000</span>
      <button id="change" class="link-btn mono" type="button">change</button>
    </div>

    <div id="proxy-edit" class="proxy-edit" hidden>
      <input id="proxy-url" class="mono" type="url" spellcheck="false" placeholder="http://localhost:3000" />
      <button id="save" type="button">Save</button>
    </div>

    <button id="decode" type="button">Decode This Page</button>

    <div id="progress-track" class="progress-track" hidden>
      <div id="progress-fill" class="progress-fill"></div>
    </div>

    <p id="status" class="status" role="status" aria-live="polite">Ready.</p>

    <script src="popup.js"></script>
  </body>
</html>
